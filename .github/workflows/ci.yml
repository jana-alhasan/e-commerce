name: CI

on:
  pull_request:
    branches:
      - e-commerce
  push:
    branches:
      - e-commerce

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject legacy Material UI imports
        run: |
          if grep -R --line-number '@material-ui/' src; then
            echo 'Legacy Material UI v4 imports found. Use @mui packages consistently.'
            exit 1
          fi
      - name: Run tests
        run: npm test -- --watchAll=false
      - name: Build production bundle
        run: npm run build
