name: E-Commerce P0 Validation

on:
  push:
    branches:
      - ec-p0-reliability

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Ensure MUI icons dependency is declared
        run: npm install --package-lock-only @mui/icons-material@^5.14.20
      - name: Commit dependency metadata when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Add missing MUI icons dependency"
            git push origin HEAD:ec-p0-reliability
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Build production bundle
        run: npm run build
