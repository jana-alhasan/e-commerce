name: E-Commerce P0 Validation

on:
  push:
    branches:
      - ec-p0-reliability

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Build production bundle
        run: npm run build
